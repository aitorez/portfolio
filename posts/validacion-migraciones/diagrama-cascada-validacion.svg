<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b78"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <!-- eje de coste -->
  <line x1="40" y1="300" x2="40" y2="30" stroke="#d5dde3" stroke-width="1"/>
  <line x1="40" y1="300" x2="730" y2="300" stroke="#d5dde3" stroke-width="1"/>
  <text x="10" y="30" font-size="11" fill="#5c6b78" transform="rotate(-90 14 165)" text-anchor="middle">coste</text>
  <text x="700" y="318" font-size="11" fill="#5c6b78" text-anchor="end">orden de ejecución</text>

  <!-- peldaños (staircase, izquierda barato -> derecha caro) -->
  <!-- 1: Que compile -->
  <rect x="70" y="270" width="110" height="26" fill="#2f6f6b" opacity="0.12" stroke="#2f6f6b" stroke-width="1.2" rx="3"/>
  <text x="125" y="287" font-size="12.5" fill="#16232e" text-anchor="middle">Que compile</text>

  <!-- 2: El conteo -->
  <rect x="200" y="240" width="110" height="26" fill="#2f6f6b" opacity="0.18" stroke="#2f6f6b" stroke-width="1.2" rx="3"/>
  <text x="255" y="257" font-size="12.5" fill="#16232e" text-anchor="middle">El conteo</text>

  <!-- 3: El esquema -->
  <rect x="330" y="200" width="120" height="26" fill="#2f6f6b" opacity="0.28" stroke="#2f6f6b" stroke-width="1.2" rx="3"/>
  <text x="390" y="217" font-size="12.5" fill="#16232e" text-anchor="middle">El esquema</text>

  <!-- 4: Agregados por columna -->
  <rect x="470" y="150" width="150" height="26" fill="#2f6f6b" opacity="0.42" stroke="#2f6f6b" stroke-width="1.2" rx="3"/>
  <text x="545" y="167" font-size="12.5" fill="#16232e" text-anchor="middle">Agregados por columna</text>

  <!-- 5: Comparación de contenido -->
  <rect x="515" y="90" width="180" height="26" fill="#2f6f6b" opacity="0.6" stroke="#2f6f6b" stroke-width="1.2" rx="3"/>
  <text x="605" y="107" font-size="12.5" fill="#16232e" text-anchor="middle">Comparación de contenido</text>

  <!-- flechas entre peldaños -->
  <line x1="180" y1="270" x2="200" y2="253" stroke="#5c6b78" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="310" y1="240" x2="330" y2="213" stroke="#5c6b78" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="450" y1="200" x2="470" y2="163" stroke="#5c6b78" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="620" y1="150" x2="600" y2="116" stroke="#5c6b78" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="70" y="330" font-size="11" fill="#5c6b78">más barato</text>
  <text x="670" y="330" font-size="11" fill="#5c6b78" text-anchor="end">más caro</text>
</svg>
